<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cadastro de paciente</title>
</head>
<body>
    <nav class="menu-conteiner">
        <section class="logo">
            <p class="logo-icon">+</p>
            <h1 class="logo-name">Hospital Aurora</h1>
        </section>
        <section class="options">
            <ul style="list-style: none;" class="list-options">
                <li class="option-content"><span class="list-style">•</span>Cadastrar paciente</li>
                <li class="option-content"><span class="list-style">•</span>Lista de pacientes</li>
            </ul>
        </section>
    </nav>
    <main>
        <header class="route-page">
            <p class="route-path">Pacientes / <span class="route-now">Cadastro de Pacientes</span></p>
        </header>
        <section class="titles-section">
            <h1 class="strong-title">Novo cadastro de paciente</h1>
            <p class="title-description">Campos obrigatórios para o atendimento atual estão sinalizados.</p>
        </section>
        <section class="form-conteiner">
            <form action="#" method="post" class="personal-form">
                <label class="title-form" for="#">Identificação</label>
                <label class="subtitle-form" for="#">Confirme os dados de identidade antes de prosseguir.</label>
                <section class="inputs-form">
                    <div class="box-input">
                        <label for="" class="input-label">Nome *</label>
                        <input type="text" required class="input-element">
                    </div>
                    <div class="box-input">
                        <label for="" class="input-label">Sobrenome *</label>
                        <input type="text" required class="input-element">
                    </div>
                    <div class="box-input">
                        <label for="" class="input-label">CPF *</label>
                        <input type="text" required class="input-element">
                    </div>
                    <div class="box-input">
                        <label for="" class="input-label">Data de nascimento *</label>
                        <input type="text" required class="input-element">
                    </div>
                    <div class="box-input">
                        <label for="" class="input-label">Sexo</label>
                        <select name="sexo" id="input-element" class="input-element">
                            <option value="Null">Prefiro não informar</option>
                            <option value="Feminino">Feminino</option>
                            <option value="Masculino">Masculino</option>
                        </select>
                    </div>
                    <div class="box-input">
                        <label for="" class="input-label">Nome da mãe ou referência</label>
                        <input type="text" class="input-element">
                    </div>
                </section>
                <section class="button-conteiner">
                    <button class="button-submit" type="submit">Cadastrar</button>
                </section>
            </form>
        </section>
    </main>
</body>
</html>
