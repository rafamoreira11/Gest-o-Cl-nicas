<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <title>Cadastro de paciente</title>
    <script src="../scripts.js" defer></script>
</head>
<body>
    <nav class="menu-conteiner">
        <section class="logo">
            <p class="logo-icon">+</p>
            <h1 class="logo-name">Hospital Aurora</h1>
        </section>
        <section class="options">
            <ul style="list-style: none;" class="list-options">
                <li class="option-content" id="cadastrar-pacientes"><span class="list-style">•</span>Cadastrar paciente</li>
                <li class="option-content" id="listar-pacientes"><span class="list-style">•</span>Lista de pacientes</li>
            </ul>
        </section>
    </nav>
    <main>
        <header class="route-page">
            <p class="route-path">Pacientes / <span class="route-now">Lista de Pacientes</span></p>
        </header>
        <section class="list-conteiner">
            <div class="table-menu">
                <h2 class="table-title">Pacientes cadastrados</h2>
                <p class="table-desc">Visualize os dados completos dos pacientes cadastrados.</p>
            </div>
            <div class="table-conteiner">
                <table class="table-pacientes">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Sobrenome</th>
                            <th>CPF</th>
                            <th>Data de nascimento</th>
                            <th>Sexo</th>
                            <th>Nome da mãe</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-pacientes">
                        
                    </tbody>
                </table>
            </div>
            
        </section>
        
    </main>
</body>
</html>
